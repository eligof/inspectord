name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, Monday 03:27 UTC — catches advisories published since last push.
    - cron: "27 3 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (python)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          # security-extended is security-focused (broader than the default
          # security suite). We deliberately avoid security-and-quality: its
          # maintainability/quality queries flag idiomatic code (e.g. `...`
          # Protocol stubs, intentional best-effort `except ...: pass`),
          # burying real security findings in note-level noise.
          queries: security-extended

      # Python is interpreted — no build step needed before analysis.
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"
