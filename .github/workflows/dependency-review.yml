name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  review:
    name: Review dependency changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Fails the PR if it introduces a dependency with a known high-severity
      # advisory. Runs against the PR's dependency-graph diff.
      - name: Dependency review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
