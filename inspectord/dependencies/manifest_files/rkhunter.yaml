version: 1.0.0
name: rkhunter
description: rkhunter — rootkit checker. Optional periodic scanner; we read its report, never update its database.
# Spec §30.13 lists rkhunter under "Optional (asked)", not under required deps:
# a host without it is fully functional, so the planner must never install it
# unasked. `optional_when` is declarative today — nothing auto-plans optional deps.
required_when:
  profiles: []
optional_when:
  profiles: [minimal, standard]
distro_packages:
  arch: [rkhunter]
service: null
# §30.6 names /etc/rkhunter.conf.d/inspectord.conf. That path is WRONG for the
# rkhunter we actually ship against: 1.4.6 reads `*.conf` from a `rkhunter.d`
# directory beside its main config, never from `<config>.conf.d`. Verified in
# /usr/bin/rkhunter (`LOCALCONFIGDIR="${configdir}/rkhunter.d"`, globbed for
# `*.conf`), in the /etc/rkhunter.conf header, and live (the run log says
# `Using local configuration directory '<dir>/rkhunter.d'`). Recorded here as a
# deliberate deviation from §30.6 rather than silently shipping a dead file.
#
# DECLARATIVE TODAY, like `optional_when` above: nothing writes this drop-in yet.
# `applier.apply_plan` does call `write_sidecar` for every plan item whose
# manifest has a `config.dropin`, but `planner.build_plan` only ever emits items
# for manifests that are REQUIRED for the active profile, and then only when a
# package is missing. rkhunter is optional (§30.13) and, on a host that already
# has it, would produce no plan item at all — so the applier never sees it.
# Installing this drop-in is a manual step until the planner grows a "configure
# an already-installed dependency" item. `validate_cmd` is likewise inert: the
# field exists in ConfigSpec but no code path executes it.
config:
  strategy: sidecar
  include_dir: /etc/rkhunter.d/
  dropin:
    filename: inspectord.conf
    template: rkhunter/inspectord.conf.j2
    owner: root
    # 0644, not the 0600 of /etc/rkhunter.conf: the contents are three
    # whitelist lines naming stock Arch wrappers, nothing secret, and a config
    # the user is expected to audit should be readable without sudo.
    mode: "0644"
  validate_cmd: [rkhunter, --config-check]
permissions: null
verify:
  binary_paths: [/usr/bin/rkhunter]
  # /usr/bin/rkhunter is 0700 root:root, so `binary_exists_and_runs` (which gates on
  # os.access(X_OK) and then runs --version) reports a healthy install as broken for
  # any non-root caller. Presence is all this manifest can honestly assert; actually
  # running rkhunter is scanner_runner's job, and it runs as root.
  health_probe:
    kind: file_exists
    path: /usr/bin/rkhunter
# §30.5's example carries `rkhunter --propupd`. It is a local baseline refresh (not
# `--update`, which is network and is forbidden outright by the scanner-runner design,
# decision 8) — but the applier never executes post_install_hooks, so declaring one
# here would be an inert claim. It belongs with the scanner adapter that needs it.
post_install_hooks: []
rollback:
  remove_dropin: false
