version: 1.0.0
id: vuln.new_critical
name: "new critical vulnerability advisory"
severity: high
category: vuln
why: |
  An installed package just started matching a Critical Arch security advisory
  that was not matched on the previous scan — a fresh advisory landed in the
  local feed, or a package was downgraded back into a vulnerable version.
  Critical advisories are the remote-code-execution / privilege-escalation
  tier; on a single-user box the fix is usually one `pacman -Syu` away.
false_positives:
  - "A same-name custom-repo or AUR rebuild whose version scheme diverges from the advisory's."
  - "A stale advisory file replayed after edits: the row set is trustworthy, the timing is not."
detect:
  any_of:
    # status Unknown gets a row and an event but never an alert (design §4):
    # the tracker has not determined the impact yet, so alerting would guess.
    - event.module == "vuln_scanner" AND event.action == "vulnerability_found" AND vulnerability.new == true AND vulnerability.severity == "Critical" AND vulnerability.status != "Unknown"
short: "critical vulnerability in {vulnerability.package}: {vulnerability.avg_id}"
detail: "{vulnerability.package} {vulnerability.installed_version} is affected by {vulnerability.cve_id} ({vulnerability.avg_id}, Critical, status {vulnerability.status}); fixed version: {vulnerability.fixed_version}. {vulnerability.advisory_url}"
labels: [vuln, cve]
